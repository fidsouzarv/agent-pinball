# Complexity limits (PADROES.md §4). With `-D warnings` in CI, crossing one
# fails the build. An `allow` must be scoped to the function and say why.
#
# Clippy reads only the nearest clippy.toml: a crate with its own file
# (crates/pinball-web) repeats these four lines.
cognitive-complexity-threshold = 15
too-many-lines-threshold = 80
too-many-arguments-threshold = 5
type-complexity-threshold = 250
