[workspace]
resolver = "3"
# Crates are added when they have a shipped caller (see AGENTS.md): collectors,
# store and test-support join once there is code for them.
members = [
    "crates/pinball-core",
    "crates/pinball-setup",
    "crates/pinball-web",
    "crates/pinball-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# Inter-crate dependencies.
pinball-core = { path = "crates/pinball-core", version = "0.1.0" }
pinball-setup = { path = "crates/pinball-setup", version = "0.1.0" }
pinball-web = { path = "crates/pinball-web", version = "0.1.0" }

# Runtime.
# HTTP surface (docs/SYSTEM_DESIGN.md §3). axum routes; hyper and hyper-util
# serve each connection so the server owns its head cap, deadline and timeouts.
axum = { version = "0.8", default-features = false }
hyper = { version = "1.7", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
tokio = { version = "1.47", default-features = false }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
maud = "0.27"
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps agent config keys where they were, so setup diffs stay minimal.
serde_json = { version = "1.0", features = ["preserve_order"] }
similar = "3.2"
tempfile = "3.27"

# Testing.
rstest = "0.27"
tower = { version = "0.5", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Runtime paths use explicit fallbacks; tests opt back in with `allow`.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
# Complexity limits; thresholds live in clippy.toml (STANDARDS.md §4).
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
# Line tables keep file:line in panics without full debuginfo in every test
# binary. Use `RUSTFLAGS="-C debuginfo=2"` for a real debugger session.
debug = "line-tables-only"

# Deps are rebuilt rarely and dominate the graph; optimising them makes tests faster.
[profile.dev.package."*"]
debug = false
opt-level = 1

# Proc macros and build scripts are run at compile time, so optimise them.
[profile.dev.build-override]
opt-level = 3
