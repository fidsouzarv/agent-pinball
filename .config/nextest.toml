# cargo-nextest configuration. Two profiles for people, one for CI:
#
#   cargo t     everyday: everything except modules named slow* / stress*
#   cargo tf    the gate: everything
#
# The skip is by module name. A test that needs more than ~1s alone either gets
# fixed or moves into a `slow`/`stress` module. The pre-push hook and CI run the
# skipped tier anyway.

[profile.default]
default-filter = "not test(/(^|::)(slow|stress)[a-z0-9_]*::/)"
# One run shows every failure.
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"
# Nothing in the everyday tier should take 5s; kill a hung test at 2 minutes.
slow-timeout = { period = "5s", terminate-after = 24 }

[profile.full]
# `all()` is required: profiles inherit default-filter from profile.default.
default-filter = "all()"
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
slow-timeout = { period = "30s", terminate-after = 8 }

[profile.ci]
default-filter = "all()"
# No retries: a retry turns a flaky test green and hides it.
retries = 0
failure-output = "immediate-final"
fail-fast = false
status-level = "fail"
final-status-level = "slow"
# Hosted runners are slower than a workstation; kill a hang after 10 minutes.
slow-timeout = { period = "60s", terminate-after = 10 }
