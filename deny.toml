# cargo-deny configuration.
# Rejects copyleft transitive deps and anything outside crates.io.

[graph]
# CI runs with --all-features; build the same graph locally.
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
# Every ignore needs the advisory id and a comment saying why it is safe.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
required-git-spec = "rev"
allow-git = []
